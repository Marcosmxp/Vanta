services:
  postgres:
    image: postgres:18-alpine
    container_name: vanta-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanta
      POSTGRES_USER: vanta
      POSTGRES_PASSWORD: vanta_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../../.infrastructure-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanta -d vanta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: vanta-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
