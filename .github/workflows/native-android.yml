name: Native Android MVP

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'scripts/validate-mobile-release-config.mjs'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android native debug APK (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: emulator
            api_url: http://10.0.2.2:8080
            artifact_name: vanta-android-emulator-debug-apk
          - name: physical-device
            api_url: http://192.168.1.70:8080
            artifact_name: vanta-android-physical-device-debug-apk
    env:
      NODE_ENV: development
      EXPO_PUBLIC_VANTA_ENV: development
      EXPO_PUBLIC_VANTA_API_URL: ${{ matrix.target.api_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install React Native Skia native binaries
        run: |
          pnpm --dir apps/mobile exec install-skia
          test -f apps/mobile/node_modules/@shopify/react-native-skia/libs/android/arm64-v8a/libskia.a

      - name: Validate native release configuration
        run: node scripts/validate-mobile-release-config.mjs

      - name: Resolve Expo public configuration
        run: pnpm --dir apps/mobile exec expo config --type public

      - name: Generate Android native project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.artifact_name }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-physical-standalone-apk:
    name: Android physical-device standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      EXPO_PUBLIC_VANTA_ENV: development
      EXPO_PUBLIC_VANTA_API_URL: http://192.168.1.70:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install React Native Skia native binaries
        run: |
          pnpm --dir apps/mobile exec install-skia
          test -f apps/mobile/node_modules/@shopify/react-native-skia/libs/android/arm64-v8a/libskia.a

      - name: Validate native release configuration
        run: node scripts/validate-mobile-release-config.mjs

      - name: Resolve Expo public configuration
        run: pnpm --dir apps/mobile exec expo config --type public

      - name: Generate Android native project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build standalone APK with bundled JavaScript
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: vanta-android-physical-device-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
