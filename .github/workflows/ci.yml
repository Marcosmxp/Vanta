name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck mobile application
        run: pnpm mobile:typecheck

  backend:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.mod

      - name: Format verification
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...
