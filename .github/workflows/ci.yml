name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck mobile application
        run: pnpm mobile:typecheck

      - name: Validate application Android bundle
        run: pnpm --filter @vanta/mobile app:validate

      - name: Validate Storybook Android bundle
        run: pnpm --filter @vanta/mobile storybook:validate

  backend:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vanta_test
          POSTGRES_USER: vanta_test
          POSTGRES_PASSWORD: vanta_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanta_test -d vanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VANTA_TEST_DATABASE_URL: postgres://vanta_test:vanta_test_only@127.0.0.1:5432/vanta_test?sslmode=disable
      VANTA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum

      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format verification
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build API binary
        run: go build ./cmd/api

      - name: Validate API container build
        run: docker build --file Dockerfile .

      - name: Validate development Compose model
        run: docker compose --file ../infrastructure/docker/compose.dev.yml config --quiet
